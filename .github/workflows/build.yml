# Builds everything from source in the Docker toolchains (docker/), on every
# push and pull request: the Linux and Windows desktop apps and the web
# version. Pushes to main also publish the web version on GitHub Pages.
# Pushing a tag like v2.0.0 publishes a GitHub release with the apps, their
# license notices and the source tarballs of everything compiled into them.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Source tarballs and language models; make checks their hashes
      - uses: actions/cache@v6
        with:
          path: out/downloads
          key: downloads-${{ hashFiles('deps/versions.mk') }}

      # Crates and the MSVC runtime that cargo-xwin downloads
      - uses: actions/cache@v6
        if: matrix.target != 'wasm'
        with:
          path: |
            out/cargo-home/registry
            out/xwin
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: tools/docker-make.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: CUBE-PDF-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CUBE-PDF-wasm
          path: site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      # The (A)GPL parts must ship with their exact source code; the
      # release carries the source of every library in the programs
      - name: Collect source tarballs
        run: make TARGET=wasm B=out SOURCES_DIR=sources sources

      - name: Assemble release files
        run: |
          mkdir -p release
          for target in linux windows wasm; do
            cp "dist/CUBE-PDF-$target/THIRD-PARTY-NOTICES.txt" \
              "release/THIRD-PARTY-NOTICES-$target.txt"
          done
          cp dist/CUBE-PDF-linux/*.deb dist/CUBE-PDF-linux/*.rpm release/
          cp dist/CUBE-PDF-windows/*-setup.exe \
            dist/CUBE-PDF-windows/*-portable.zip release/
          (cd dist/CUBE-PDF-wasm && zip -qr ../../release/CUBE-PDF-web.zip .)
          cp LICENSE release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/* sources/*
          --title "$GITHUB_REF_NAME" --generate-notes
