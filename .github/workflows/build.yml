# Builds everything from source in the Docker toolchains (docker/), on every
# push and pull request: the Linux and Windows desktop apps, the Android
# app and the web version. Pushing a tag like v2.0.0 publishes the web
# version on GitHub Pages and a GitHub release with the apps, their license
# notices and the source tarballs of everything compiled into them.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, wasm, android]
    runs-on: ubuntu-latest
    steps:
      # The whole history with its tags: the version is the latest tag
      # (mk/version.mk)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The cached builds below keep the times they were made at, which
      # are older than a fresh checkout; dated back, the checkout no longer
      # looks newer to make. The cache keys cover what each build is made
      # from.
      - name: Date the checkout back
        run: git ls-files -z | xargs -0 touch -h -d @0

      # Source tarballs and language models; make checks their hashes
      - uses: actions/cache@v6
        with:
          path: out/downloads
          key: downloads-${{ hashFiles('deps/versions.mk') }}

      # The libraries, with their unpacked sources: the notices read the
      # license files there. Android has a build directory per ABI,
      # out/android-<abi>, hence the "*".
      - uses: actions/cache@v6
        with:
          path: |
            out/${{ matrix.target }}*/src
            out/${{ matrix.target }}*/build
            out/${{ matrix.target }}*/prefix
            out/${{ matrix.target }}*/obj/utf8-manifest.o
            out/${{ matrix.target }}*/stamp/zlib
            out/${{ matrix.target }}*/stamp/leptonica
            out/${{ matrix.target }}*/stamp/tesseract
            out/${{ matrix.target }}*/stamp/mupdf
            out/${{ matrix.target }}*/stamp/ghostscript-src
            out/${{ matrix.target }}*/stamp/ghostscript
          key: libs-${{ matrix.target }}-${{ hashFiles('Makefile', 'mk/**',
            'deps/**', format('docker/{0}.Dockerfile', matrix.target)) }}

      # Crates, the MSVC runtime that cargo-xwin downloads and the compiled
      # crates; the Dockerfile sets the Rust version
      - uses: actions/cache@v6
        if: matrix.target != 'wasm'
        with:
          path: |
            out/cargo-home/registry
            out/xwin
            out/${{ matrix.target }}*/cargo
            !out/${{ matrix.target }}*/cargo/*/release/bundle
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock',
            'desktop/Cargo.lock',
            format('docker/{0}.Dockerfile', matrix.target)) }}

      # Gradle itself and the Android libraries, which gradle.lockfile pins
      - uses: actions/cache@v6
        if: matrix.target == 'android'
        with:
          path: |
            out/gradle-home/caches
            out/gradle-home/wrapper
          key: gradle-${{ hashFiles('desktop/gen/android/**/*.kts',
            'desktop/gen/android/**/gradle.lockfile',
            'desktop/gen/android/gradle/wrapper/*.properties') }}

      # Building the toolchain image compiles tauri-cli and cargo-xwin,
      # which takes minutes, so its layers are cached between runs
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/${{ matrix.target }}.Dockerfile
          tags: ocr-${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # The APK is signed with the keystore in the repository's secrets;
      # without them, as in pull requests from forks, it comes out unsigned
      - name: Unpack the Android keystore
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p out
            echo "$KEYSTORE" | base64 -d > out/release.jks
            echo "ANDROID_KEYSTORE=/build/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          OCR_IMAGE_BUILT: 1
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/docker-make.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: CUBE-PDF-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CUBE-PDF-wasm
          path: site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      # The (A)GPL parts must ship with their exact source code; the
      # release carries the source of every library in the programs
      - name: Collect source tarballs
        run: make TARGET=wasm B=out SOURCES_DIR=sources sources

      # The apps are named <name>-<version>-<platform>[-<libc>]-<arch>.<ext>,
      # the version taken from the tag
      - name: Assemble release files
        run: |
          mkdir -p release
          for target in linux windows wasm android; do
            cp "dist/CUBE-PDF-$target/THIRD-PARTY-NOTICES.txt" \
              "release/THIRD-PARTY-NOTICES-$target.txt"
          done
          app="release/CUBE-PDF-${GITHUB_REF_NAME#v}"
          cp dist/CUBE-PDF-linux/*.deb "$app-linux-glibc-x86_64.deb"
          cp dist/CUBE-PDF-linux/*.rpm "$app-linux-glibc-x86_64.rpm"
          cp dist/CUBE-PDF-windows/*-setup.exe "$app-windows-x86_64.exe"
          cp dist/CUBE-PDF-windows/*-portable.zip "$app-windows-x86_64.zip"
          cp dist/CUBE-PDF-android/*.apk "$app-android-universal.apk"
          (cd dist/CUBE-PDF-wasm && zip -qr "../../$app-web-wasm32.zip" .)
          cp LICENSE release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/* sources/*
          --title "$GITHUB_REF_NAME" --generate-notes
