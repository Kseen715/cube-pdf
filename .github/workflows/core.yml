# The tests of the OCR core (tests/core) in the Linux toolchain, for pushes
# to main and pull requests that change the core or what it is built from.
# The libraries come from the caches build.yml uses (.github/actions).
name: Core

on:
  push:
    branches: [main]
    paths: &core
      - 'core/**'
      - 'tests/core/**'
      - 'deps/**'
      - 'mk/**'
      - Makefile
      - docker/linux.Dockerfile
      - .github/workflows/core.yml
      - '.github/actions/**'
  pull_request:
    paths: *core

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux

      - name: Test
        env:
          OCR_IMAGE_BUILT: 1
        run: tools/docker-make.sh linux test
