<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUBE-PDF</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<script src="js/theme.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="brand">
      <!-- the drawing of tools/make_assets.py, in the theme's colours -->
      <svg class="mark" viewBox="148 92 728 840" aria-hidden="true">
        <path class="mark-top" d="M512 92 876 302 512 512 148 302Z"/>
        <path class="mark-left" d="M148 302 512 512V932L148 722Z"/>
        <path class="mark-right" d="M512 512 876 302V722L512 932Z"/>
        <path class="mark-lines" d="M210 438l240 138v34L210 472Z
          M210 538l270 156v34L210 572Z M210 638l200 115v34L210 672Z"/>
      </svg>
      CUBE-PDF
    </span>
    <div class="theme" role="group" aria-label="Тема оформления">
      <button type="button" data-theme-choice="light">
        <span class="swatch" aria-hidden="true"></span>
        <span class="label">Светлая</span></button>
      <button type="button" data-theme-choice="dark">
        <span class="swatch" aria-hidden="true"></span>
        <span class="label">Тёмная</span></button>
      <button type="button" data-theme-choice="auto">
        <span class="swatch" aria-hidden="true"></span>
        <span class="label">Как в системе</span></button>
    </div>
  </div>
</header>

<main>
  <div class="title">
    <h1>Сделать PDF, в котором можно искать текст</h1>
    <p class="lede" id="intro"></p>
    <p class="lede" id="native" hidden>Приложение для Windows и Linux
      распознаёт быстрее, чем браузер. Скачать его можно на
      <a id="releases" target="_blank" rel="noopener">странице релизов
      на GitHub</a>.</p>
  </div>

  <div class="layout">
    <section class="panel files" id="files" aria-labelledby="files-title">
      <div class="panel-head">
        <h2 id="files-title">Файлы</h2>
        <span class="count" id="count"></span>
        <button id="clear" class="text-button" type="button">
          Очистить список</button>
      </div>
      <ul id="tasks" class="tasks"></ul>
      <button id="drop" class="drop" type="button">
        <span class="drop-title pointer">Перетащите сюда файлы или
          папку</span>
        <span class="drop-title touch">Выберите файлы</span>
        <span class="drop-more"><span class="pointer">или нажмите, чтобы
          выбрать.</span> Подходят PDF, JPG, PNG и TIFF.</span>
        <span class="drop-again">Добавить файлы</span>
      </button>
      <div class="panel-foot">
        <p id="status" class="status" aria-live="polite"></p>
        <progress id="progress" max="100" value="0"></progress>
      </div>
    </section>

    <aside class="panel settings" aria-label="Настройки распознавания">
      <section class="group" aria-labelledby="languages-title">
        <h2 id="languages-title">Язык текста</h2>
        <div class="choices" id="languages"></div>
        <p class="note">Можно отметить несколько. Не уверены — оставьте
          как есть.</p>
      </section>
      <section class="group" aria-labelledby="processing-title">
        <h2 id="processing-title">Обработка</h2>
        <div class="choices">
          <label class="choice"><input type="checkbox" id="deskew">
            Выпрямлять наклонённые страницы</label>
          <label class="choice"><input type="checkbox" id="force">
            Распознать заново, даже если в файле уже есть текст</label>
        </div>
      </section>
      <button id="start" class="start" type="button"></button>
    </aside>
  </div>

  <footer class="foot">
    <span class="release">
      <span id="version" class="version"></span>
      <button id="update" class="update" type="button" hidden
        title="Вышла новая версия" aria-label="Вышла новая версия">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg></button>
    </span>
    <button id="about" class="text-button" type="button">
      О программе и лицензиях</button>
  </footer>
</main>
<dialog id="dialog"></dialog>
<input type="file" id="file-input" multiple hidden>
</body>
</html>
