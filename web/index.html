<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUBE-PDF</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<script src="js/theme.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="brand">
      <!-- the drawing of tools/make_assets.py, in the theme's colours -->
      <svg class="mark" viewBox="148 92 728 840" aria-hidden="true">
        <path class="mark-top" d="M512 92 876 302 512 512 148 302Z"/>
        <path class="mark-left" d="M148 302 512 512V932L148 722Z"/>
        <path class="mark-right" d="M512 512 876 302V722L512 932Z"/>
        <path class="mark-lines" d="M210 438l240 138v34L210 472Z
          M210 538l270 156v34L210 572Z M210 638l200 115v34L210 672Z"/>
      </svg>
      CUBE-PDF
    </span>
    <div class="bar-controls">
      <div class="theme" role="group" data-i18n-label="theme.group">
        <button type="button" data-theme-choice="light">
          <span class="swatch" aria-hidden="true"></span>
          <span class="label" data-i18n="theme.light"></span></button>
        <button type="button" data-theme-choice="dark">
          <span class="swatch" aria-hidden="true"></span>
          <span class="label" data-i18n="theme.dark"></span></button>
        <button type="button" data-theme-choice="auto">
          <span class="swatch" aria-hidden="true"></span>
          <span class="label" data-i18n="theme.auto"></span></button>
      </div>
      <!-- a native list over the button, so every platform picks well -->
      <label class="locale">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6"/>
          <path d="M2 8h12M8 2c-2.2 2.4-2.2 9.6 0 12M8 2c2.2 2.4 2.2 9.6 0
            12"/></svg>
        <span id="locale-code" aria-hidden="true"></span>
        <select id="locale" data-i18n-label="locale.group"></select>
      </label>
    </div>
  </div>
</header>

<main>
  <div class="title">
    <h1 data-i18n="title"></h1>
    <p class="lede" id="intro"></p>
    <p class="lede" id="native" hidden><span data-i18n="native"></span>
      <a id="releases" target="_blank" rel="noopener"
        data-i18n="native.link"></a>.</p>
  </div>

  <div class="layout">
    <section class="panel files" id="files" aria-labelledby="files-title">
      <div class="panel-head">
        <h2 id="files-title" data-i18n="files.title"></h2>
        <span class="count" id="count"></span>
        <button id="clear" class="text-button" type="button"
          data-i18n="files.clear"></button>
      </div>
      <ul id="tasks" class="tasks"></ul>
      <button id="drop" class="drop" type="button">
        <span class="drop-title pointer" data-i18n="drop.title"></span>
        <span class="drop-title touch" data-i18n="drop.titleTouch"></span>
        <span class="drop-more"><span class="pointer"
          data-i18n="drop.click"></span>
          <span data-i18n="drop.types"></span></span>
        <span class="drop-again" data-i18n="drop.again"></span>
      </button>
      <div class="panel-foot">
        <p id="status" class="status" aria-live="polite"></p>
        <progress id="progress" max="100" value="0"></progress>
      </div>
    </section>

    <aside class="panel settings" data-i18n-label="settings">
      <section class="group" aria-labelledby="languages-title">
        <h2 id="languages-title" data-i18n="languages.title"></h2>
        <div class="choices" id="languages"></div>
        <p class="note" data-i18n="languages.note"></p>
      </section>
      <section class="group" aria-labelledby="processing-title">
        <h2 id="processing-title" data-i18n="processing.title"></h2>
        <div class="choices">
          <label class="choice"><input type="checkbox" id="deskew">
            <span data-i18n="processing.deskew"></span></label>
          <label class="choice"><input type="checkbox" id="force">
            <span data-i18n="processing.force"></span></label>
        </div>
      </section>
      <button id="start" class="start" type="button"></button>
    </aside>
  </div>

  <footer class="foot">
    <span class="release">
      <span id="version" class="version"></span>
      <button id="update" class="update" type="button" hidden
        data-i18n-title="update.available"
        data-i18n-label="update.available">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg></button>
    </span>
    <button id="about" class="text-button" type="button"
      data-i18n="about.link"></button>
  </footer>
</main>
<dialog id="dialog"></dialog>
<input type="file" id="file-input" multiple hidden>
</body>
</html>
