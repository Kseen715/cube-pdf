# Formatter and linter settings: `ruff format` and `ruff check` (see AGENTS.md)
line-length = 80
target-version = "py311"
extend-include = ["*.spec"]

[format]
quote-style = "single"

[lint]
select = ["E", "W", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# PyInstaller injects Analysis, PYZ, EXE, Splash and Tree into spec files
"*.spec" = ["F821"]
