# The app shell (Tauri): a window that shows the shared page from web/
# and starts the native ocr-pdf-core. Built by mk/desktop.mk and mk/apk.mk.
[package]
name = "ocr-pdf"
# The apps take their version from the git tag (mk/version.mk)
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
# The app updates itself from this repository's releases (src/update.rs)
repository = "https://github.com/Kseen715/cube-pdf"
publish = false

# Android loads the app as a library; the desktop builds use main.rs
[lib]
name = "ocr_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
# Downloads updates; rustls with its bundled root certificates, so every
# target has the same TLS without a system library
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
